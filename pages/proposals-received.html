<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propostas Recebidas - EcoTrade</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/base/variables.css">
    <link rel="stylesheet" href="../assets/css/base/reset.css">
    <link rel="stylesheet" href="../assets/css/components/brand.css">
    <link rel="stylesheet" href="../assets/css/pages/dashboard.css">
    <link rel="stylesheet" href="../assets/css/pages/my-ads.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <a href="../index.html" class="sidebar-brand">
                <img src="../assets/img/box-logo.svg" alt="Logo EcoTrade" width="36" height="36">
                <span class="brand-text-wrapper fs-5">
                    <span class="brand-eco">Eco</span><span class="brand-trade">Trade</span>
                </span>
            </a>
            <nav class="sidebar-nav">
                <div class="sidebar-heading">Menu Principal</div>
                <a href="./dashboard.html" class="sidebar-link"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
                <a href="./items.html" class="sidebar-link"><i class="bi bi-card-list"></i> Feed de Itens</a>
                <a href="./my-ads.html" class="sidebar-link"><i class="bi bi-box-seam"></i> Meus Anúncios</a>
                <a href="./proposals-received.html" class="sidebar-link active"><i class="bi bi-inbox"></i> Propostas Recebidas</a>
                <div class="sidebar-heading mt-4">Conta</div>
                <a href="./profile.html" class="sidebar-link"><i class="bi bi-person"></i> Meu Perfil</a>
                <a href="./settings.html" class="sidebar-link"><i class="bi bi-gear"></i> Configurações</a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" id="sidebar-logout" class="sidebar-link px-0 text-danger"><i class="bi bi-box-arrow-left"></i> Sair</a>
            </div>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <div>
                    <h2 class="fw-bold mb-1" style="color: var(--color-primary);">Propostas Recebidas</h2>
                </div>
            </div>
            <div class="data-table-container">
                <table class="table table-custom table-ads">
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Interessado</th>
                            <th>Tipo</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="proposals-received-tbody"></tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/proposals-received.js"></script>
</body>
</html>
