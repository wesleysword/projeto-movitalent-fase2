<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorar Itens - EcoTrade</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/base/variables.css">
    <link rel="stylesheet" href="../assets/css/base/reset.css">
    <link rel="stylesheet" href="../assets/css/layout/navbar.css">
    <link rel="stylesheet" href="../assets/css/components/cards.css">
</head>
<body style="padding-top: 100px;">

    <nav class="navbar navbar-expand-lg navbar-custom py-3 shadow-sm fixed-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="../index.html">
                <img src="../assets/img/box-logo.svg" alt="Logo EcoTrade" width="40" height="40">
                <span class="navbar-brand-text text-orange">EcoTrade</span>
            </a>
            
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-expanded="false" aria-label="Alternar navegação">
                <i class="bi bi-list fs-2 text-white"></i>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-3 mt-3 mt-lg-0">
                    <li class="nav-item">
                        <a class="btn btn-outline-light rounded-pill px-4 fw-bold w-100" href="./auth.html">
                            Entrar
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-custom-secondary rounded-pill px-4 fw-bold w-100" href="./auth.html#register">
                            Cadastro
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row mb-5">
            <div class="col-lg-8">
                <h1 class="fw-bold" style="color: var(--color-primary);">Marketplace EcoTrade</h1>
                <p class="text-muted fs-5">Descubra itens disponíveis para retirada, compra ou descarte inteligente.</p>
            </div>
        </div>

        <div class="row g-4" id="showcase-grid">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-secondary" role="status">
                    <span class="visually-hidden">Loading items...</span>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-5 bg-white border-top mt-5">
        <div class="container text-center">
            <p class="text-muted mb-0">&copy; 2024 EcoTrade - Economia Circular Inteligente.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/showcase.js"></script>
</body>
</html>
