<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTrade - Descarte Inteligente & Negociação</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/base/variables.css">
    <link rel="stylesheet" href="assets/css/base/reset.css">
    
    <style>
        /* Estilos temporários para visualização da etapa inicial.
           Serão movidos para assets/css/layout/navbar.css no futuro */
        .navbar-custom {
            background-color: var(--color-primary);
        }
        .navbar-brand-text {
            color: var(--color-white);
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .text-orange {
            color: var(--color-secondary) !important;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-custom py-3 shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <img src="assets/img/box-logo.svg" alt="Logo EcoTrade" width="40" height="40">
                <span class="navbar-brand-text text-orange">Eco<span class="text-black">Trade</span></span>
            </a>
            
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-toggle="target="#navbarNav" aria-expanded="false" aria-label="Alternar navegação">
                <i class="bi bi-list fs-2 text-white"></i>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-2">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="#">Entrar</a>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-warning fw-bold text-dark px-4 rounded-pill" style="background-color: var(--color-secondary); border: none; color: white !important;">
                            <i class="bi bi-plus-circle me-1"></i> Anunciar
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main id="app-container" class="container py-5">
        <div class="text-center mt-5">
            <h1 class="fw-bold" style="color: var(--color-primary);">Bem-vindo ao EcoTrade</h1>
            <p class="text-muted">A plataforma inteligente para conectar quem precisa descartar com quem pode reaproveitar.</p>
            <div class="spinner-border text-secondary mt-3" role="status">
                <span class="visually-hidden">Carregando...</span>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script type="module" src="js/main.js"></script>
</body>
</html>
